services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic"]
      interval: 3s
      retries: 20

  auth_serv:
    build: ./services/auth_serv
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clinic:clinic@db:5432/clinic
      RECP_URL: http://recp_serv:8000
    ports: ["8001:8000"]
    depends_on: { db: { condition: service_healthy } }

  # recp_serv — Java (Spring Boot), пишет Лёша.
  # Внутри контейнера слушать порт 8000 (server.port=8000), Dockerfile в корне папки сервиса.
  # Пока Java-сервиса нет, поднимать так:  docker compose up db auth_serv user_serv
  recp_serv:
    build: ./services/recp_serv
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/clinic
      SPRING_DATASOURCE_USERNAME: clinic
      SPRING_DATASOURCE_PASSWORD: clinic
    ports: ["8002:8000"]
    depends_on: { db: { condition: service_healthy } }

  user_serv:
    build: ./services/user_serv
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clinic:clinic@db:5432/clinic
      RECP_URL: http://recp_serv:8000
    ports: ["8003:8000"]
    depends_on: { db: { condition: service_healthy } }

volumes:
  pgdata:
